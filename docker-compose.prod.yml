version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: concert-ticketing-api:latest
    container_name: concert-ticketing-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - production

networks:
  production:
    driver: bridge
